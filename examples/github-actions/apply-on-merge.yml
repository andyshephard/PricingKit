# Example: apply the reviewed pricing plan when it is merged to main, after a
# manual approval, with the pricingkit CLI.
#
# Documentation only. This file is NOT active in the PricingKit repo. To use
# it, copy it to .github/workflows/ in your own repository, together with
# plan-on-pr.yml (which posts the plan and its hash on the pull request), and
# set up:
#
#   An environment named "pricing" (Settings > Environments) with
#     - Required reviewers: the people who may approve a price change. The
#       apply job waits until one of them approves this run.
#     - Deployment branches: main only.
#     - Environment secrets with WRITE access, kept only here:
#         ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY     App Store Connect, or
#         GOOGLE_SERVICE_ACCOUNT_JSON                     Google Play
#   Repository variables
#     PRICINGKIT_PLAN    the committed plan file, e.g. pricing/plan.json
#     PRICINGKIT_EXPECT_BUNDLE_ID / PRICINGKIT_EXPECT_PACKAGE   (recommended)
#                        the only app this job may write to
#     PRICINGKIT_ALLOW_BASE_PRICES   "true" to let a plan change base prices
#                        (offer plans don't need it). App Store base-price
#                        writes rest on two behaviours not yet confirmed on a
#                        test app; see the PricingKit README before enabling it.
#
# What it does, on a push to main that changes the plan file:
#   1. waits for a required reviewer of the "pricing" environment to approve
#   2. reads the plan hash from the committed plan file (the file reviewed in
#      the pull request; plan-on-pr.yml printed the same hash there) and runs
#        pricingkit apply <plan> --confirm <hash>
#      A plan file edited after review has another hash than the one shown on
#      the pull request; compare them before approving.
#   3. uploads the run log (pricingkit.applyRun) as an artifact, whatever the result
#   4. on failure, prints how to resume: re-run this workflow by hand
#      (Actions > Pricing apply > Run workflow) with the failed run's ID; it
#      downloads that run log and continues with --resume (after the same
#      approval). Ops already done are skipped, and nothing changes that the
#      plan didn't show. A run log of another plan (the plan file changed on
#      main since) is refused.
# Deleting offers is never done here: a plan with deletes fails with
# REDEMPTIONS_UNCHECKED and must be applied by a person with --force-delete.
#
# Undo: download the run log artifact and run, locally,
#   pricingkit undo <plan> <run.json>
# then review and commit the undo plan as a new plan file.

name: Pricing apply

on:
  push:
    branches: [main]
    paths:
      - "pricing/plan.json" # REPLACE with your PRICINGKIT_PLAN path (variables aren't allowed here)
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "ID of a failed run of this workflow to resume (from its URL)"
        required: true
        type: string

permissions: {}

# Never two applies at once; a second waits for the first
concurrency:
  group: pricing-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pricing
    permissions:
      contents: read
      actions: read # only to download a previous run's log when resuming
    steps:
      - name: Check out the merged commit (the reviewed plan file)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Check out PricingKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andyshephard/PricingKit
          # Pin the full commit SHA of a PricingKit version you have reviewed
          ref: 0000000000000000000000000000000000000000 # REPLACE with a reviewed commit SHA
          path: pricingkit
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: pricingkit/.nvmrc
          cache: npm
          cache-dependency-path: pricingkit/package-lock.json

      - name: Install
        working-directory: pricingkit
        run: npm ci --no-audit --no-fund

      - name: Download the run log to resume
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          case "$RESUME_RUN_ID" in (''|*[!0-9]*) echo "::error::resume_run_id must be a run ID (digits)"; exit 1;; esac
          gh run download "$RESUME_RUN_ID" -n pricingkit-run-log -D "$RUNNER_TEMP/previous"
          test -f "$RUNNER_TEMP/previous/run.json"

      - name: Apply the committed plan
        id: apply
        working-directory: pricingkit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PRICINGKIT_EXPECT_BUNDLE_ID: ${{ vars.PRICINGKIT_EXPECT_BUNDLE_ID }}
          PRICINGKIT_EXPECT_PACKAGE: ${{ vars.PRICINGKIT_EXPECT_PACKAGE }}
          ALLOW_BASE_PRICES: ${{ vars.PRICINGKIT_ALLOW_BASE_PRICES }}
          PLAN: ${{ github.workspace }}/repo/${{ vars.PRICINGKIT_PLAN }}
          RUN_LOG: ${{ runner.temp }}/run/run.json
          RESUMING: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p "$(dirname "$RUN_LOG")"
          # The hash of the plan file as committed: what plan-on-pr.yml showed on the pull request
          # diff exits 2 for a plan with changes; that's the normal case here
          summary=$(npx pricingkit diff "$PLAN" --json) || [ $? -eq 2 ]
          hash=$(printf '%s' "$summary" | jq -r '.changeSetHash // empty')
          [ -n "$hash" ] || { echo "::error::Could not read the plan hash"; exit 1; }
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Applying $PLAN with plan hash $hash" >> "$GITHUB_STEP_SUMMARY"

          args=(apply "$PLAN" --confirm "$hash" --run-out "$RUN_LOG" --budget 2000)
          [ "$ALLOW_BASE_PRICES" = "true" ] && args+=(--allow-base-prices)
          if [ "$RESUMING" = "true" ]; then
            cp "$RUNNER_TEMP/previous/run.json" "$RUN_LOG"
            args+=(--resume "$RUN_LOG")
          fi
          set +e
          npx pricingkit "${args[@]}" | tee "$RUNNER_TEMP/apply.txt"
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '```'
            cat "$RUNNER_TEMP/apply.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pricingkit-run-log
          path: ${{ runner.temp }}/run/run.json
          retention-days: 90
          if-no-files-found: ignore

      - name: How to resume
        if: failure()
        env:
          PLAN: ${{ vars.PRICINGKIT_PLAN }}
          HASH: ${{ steps.apply.outputs.hash }}
          ALLOW_BASE_PRICES: ${{ vars.PRICINGKIT_ALLOW_BASE_PRICES }}
        run: |
          flag=""
          [ "$ALLOW_BASE_PRICES" = "true" ] && flag=" --allow-base-prices"
          {
            echo '## The apply did not complete'
            echo
            echo "The run log is in the **pricingkit-run-log** artifact of this run. Ops already done are recorded there and won't be sent again."
            echo
            echo "Resume here: Actions > Pricing apply > Run workflow, with resume_run_id = $GITHUB_RUN_ID"
            echo
            echo 'Or locally, after downloading the artifact:'
            echo '```'
            echo "pricingkit apply $PLAN --confirm ${HASH:-<plan hash>} --resume run.json$flag"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::Pricing apply did not complete; resume with run ID $GITHUB_RUN_ID (see the job summary)"
